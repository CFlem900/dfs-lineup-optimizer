# Alembic Configuration for RotationEngine
# -----------------------------------------
# Uses DATABASE_URL from .env (loaded by env.py).
# Async support via asyncpg driver.

[alembic]
script_location = alembic
prepend_sys_path = .

# The sqlalchemy.url is set programmatically in env.py from DATABASE_URL
# so we leave it blank here to avoid hardcoding credentials.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
