[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

addopts =
    --verbose
    --tb=short

markers =
    unit: Unit tests
    integration: Integration tests
    benchmark: Performance benchmarks
    stress: Stress and load tests
    slow: Slow running tests
    redis: Tests requiring Redis

timeout = 300
